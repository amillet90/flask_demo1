<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon"  href="{{ url_for('static', filename='iconeweb.ico') }}" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Etudiants</title>
</head>
<body>

<div class="container">
    <h1>listes des étudiants<img src="{{ url_for('static', filename='image_iut.jpeg') }}" alt="image iut"  /></h1>

    <a href="/etudiant/add" class="btn btn-success">ajouter un étudiant</a>

    {% if etudiants | length >= 1 %}
        <table class="table">
            <tr>
                <th>id</th><th>nom</th><th>groupe</th><th>actions</th>
            </tr>
            {% for etudiant in etudiants %}
                <tr>
                    <td>{{ etudiant.id }}</td>
                    <td>{{ etudiant.nom }}</td>
                    <td>{{ etudiant.groupe_id }}</td>
                    <td>
                        <a href="/etudiant/edit?id={{ etudiant.id }}" class="btn btn-success">editer</a>&nbsp;
                        <a href="/etudiant/delete?id={{ etudiant.id }}" class="btn btn-danger">supprimer</a>
                    </td>
                </tr>
            {% endfor %}
        </table>
    {% else %}
        <h2> la liste des étudiants est vide</h2>
    {% endif %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
