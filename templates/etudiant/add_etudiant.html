<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'Étudiant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h1>Formulaire d'Étudiant</h1>
    <form action="/etudiant/add" method="post">
        <!-- Champs pour saisir les informations de l'étudiant -->
        <div class="mb-3">
            <label for="nom" class="form-label">Nom de l'étudiant :</label>
            <input type="text" class="form-control" id="nom" placeholder="Entrez le nom de l'étudiant" required name="nom">
        </div>
        <div class="mb-3">
            <label for="groupe" class="form-label">Groupe de l'étudiant :</label>
            <select name="id_groupe" id="groupe" required class="form-select">
                <option value="">Sélectionner un groupe</option>
                {% for groupe in groupes %}
                    <option value="{{ groupe.id }}"> {{ groupe.libelle }} </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
